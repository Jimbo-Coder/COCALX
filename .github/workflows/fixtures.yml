# Build a minimal Einstein Toolkit with CarpetX and run the COCAL_IDX fixture
# tests, only when the reader, its tests or this CI change.
name: COCAL_IDX fixtures

on:
  push:
    paths:
      - "COCAL_IDX/src/**"
      - "COCAL_IDX/*.ccl"
      - "COCAL_IDX/test/**"
      - ".github/ci/**"
      - ".github/workflows/fixtures.yml"
  pull_request:
    paths:
      - "COCAL_IDX/src/**"
      - "COCAL_IDX/*.ccl"
      - "COCAL_IDX/test/**"
      - ".github/ci/**"
      - ".github/workflows/fixtures.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fixtures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install compilers and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gfortran cmake libopenmpi-dev openmpi-bin \
            zlib1g-dev libhdf5-dev

      # The toolkit checkout and build; only the reader is recompiled.
      - name: Restore the Cactus build
        uses: actions/cache@v4
        with:
          path: cactus-ci
          key: cactusx-${{ hashFiles('.github/ci/cocalx.th', '.github/ci/ubuntu.cfg') }}-${{ github.sha }}
          restore-keys: cactusx-${{ hashFiles('.github/ci/cocalx.th', '.github/ci/ubuntu.cfg') }}-

      - name: Build and run the fixtures
        run: .github/ci/run.sh cactus-ci
